# Checagens automáticas das regras que CONTRIBUTING.md declara em prosa.
# Rodar localmente com: pre-commit run --all-files (pip install pre-commit)
# CI roda os mesmos hooks no job `checks`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
        exclude: '\.(html|csv|txt)$'
      - id: trailing-whitespace
        # .md: espaço duplo no fim da linha é quebra de linha forçada em
        # Markdown (ver .editorconfig) — não "corrigir".
        exclude: '\.md$'
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        files: ^tools/
        # auditlib.py e check_data.py: fora do escopo desta reorganização
        # (outro agente edita esses arquivos em paralelo) — nunca
        # reformatar/relintar por baixo de um trabalho em andamento. Ver a
        # nota equivalente em ruff.toml. audit_6*.py (fase 60) saiu desta
        # lista de propósito: entregue e lint-limpo (2026-09-04), passa a
        # ser lintado como qualquer script novo de tools/.
        exclude: ^tools/(auditlib|check_data)\.py$
      - id: ruff-format
        files: ^tools/
        exclude: ^tools/(auditlib|check_data)\.py$

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: local
    hooks:
      - id: data-invariants
        name: data/*.json satisfazem as 8 invariantes (check_data.py)
        entry: python3 tools/check_data.py
        language: system
        files: ^(tools/(check_data|auditlib)\.py|data/(master|classify|classify_orfas|journals|decisoes_scimago)\.json)$
        pass_filenames: false
      - id: pending-generated
        name: data/derived/*.csv batem com master+classify+journals+decisoes
        entry: python3 tools/audit_50_pending.py --check
        language: system
        files: ^(tools/(audit_50_pending|auditlib)\.py|data/(master|classify|journals|decisoes_scimago)\.json|data/derived/(pendencias|sem_quartil)\.csv)$
        pass_filenames: false
      - id: report-generated
        name: reports/01-impacto/index.html bate com dados.json+master+classify
        entry: python3 tools/audit_80_report_html.py --check
        language: system
        files: ^(tools/(audit_80_report_html|auditlib)\.py|data/(master|classify)\.json|reports/01-impacto/(dados\.json|index\.html))$
        pass_filenames: false
      - id: tier-rule
        name: journals.json satisfaz a regra de tier (audit_41_scimago)
        entry: python3 tools/audit_41_scimago.py --check
        language: system
        files: ^(tools/(audit_41_scimago|auditlib)\.py|data/journals\.json)$
        pass_filenames: false
      - id: numbers-generated
        name: reports/01-impacto/{dados.json,numeros.txt} batem com data/ (audit_70)
        entry: python3 tools/audit_70_numbers.py --check
        language: system
        files: ^(tools/audit_70_numbers\.py|config\.json|data/.*\.json|reports/01-impacto/(dados\.json|numeros\.txt))$
        pass_filenames: false
      - id: svgs-generated
        name: docs/assets/*.svg batem com dados.json e tools/README.md (audit_82)
        entry: python3 tools/audit_82_readme_svgs.py --check
        language: system
        files: ^(tools/(audit_82_readme_svgs\.py|README\.md)|ROADMAP\.md|reports/01-impacto/dados\.json|docs/assets/.*\.svg)$
        pass_filenames: false
      - id: report-numbers
        name: todo número da prosa do relatório aponta para numeros.txt (check_numbers)
        entry: python3 tools/check_numbers.py --prose reports/01-impacto/main.typ --exempt reports/01-impacto/check_numbers_exempt.txt
        language: system
        files: ^(tools/check_numbers\.py|reports/01-impacto/(main\.typ|numeros\.txt|check_numbers_exempt\.txt))$
        pass_filenames: false
      - id: readme-numbers
        name: todo número do README aponta para numeros.txt (check_numbers)
        entry: python3 tools/check_numbers.py --prose README.md --exempt reports/01-impacto/check_numbers_exempt.txt
        language: system
        files: ^(tools/check_numbers\.py|README\.md|reports/01-impacto/numeros\.txt)$
        pass_filenames: false
