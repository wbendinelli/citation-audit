<path d="M1236.8 458.0 L1248.8 458.0" stroke="#6D675F" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
<rect x="1250.8" y="386.0" width="279.2" height="66.0" rx="10" fill="#315B86" />
<text x="1390.4" y="438.0" font-family="'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="16.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">foundational</text>
