<text x="578.0" y="558.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#6D675F" text-anchor="start">o citante diz o que o artigo diz?</text>
