<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title>Seis dimensões da leitura de uma citação</title>
<desc>Os eixos ortogonais da taxonomia v2 (METHOD.md §16): presence, depth, stance, accuracy com os subcódigos de distorção de Greenberg, reuse e o campo auxiliar relation. Cada eixo é codificado à parte; o veredito de uma citação é a tupla dos valores, combinada por regra -- não uma média numa escala única.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#6D675F"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#315B86"/>
  </marker>
  <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#D9822B"/>
  </marker>
  <marker id="arrowTerra" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#C96F3F"/>
  </marker>
  <marker id="arrowSage" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
    <path d="M0,0 L10,5 L0,10 Z" fill="#4E8752"/>
  </marker>
  <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#161311" flood-opacity="0.10"/>
  </filter>
</defs>
<rect width="1600" height="980" fill="#FBF9F6"/>
<text x="48.0" y="54.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6D675F" text-anchor="start" letter-spacing="1.6">CITATION-AUDIT · TAXONOMIA V2</text>
<text x="48.0" y="96.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#161311" text-anchor="start">Seis dimensões da leitura de uma citação</text>
<text x="48.0" y="128.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#6D675F" text-anchor="start">METHOD.md §16 — cada eixo é lido separado; o veredito final combina os seis por regra, não por média.</text>
<rect x="48.0" y="176.0" width="1504.0" height="108.0" rx="20" fill="#FFFFFF" stroke="#E4DFD7" stroke-width="1.5" filter="url(#cardShadow)"/>
<text x="70.0" y="208.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#161311" text-anchor="start">EIXO 1 · PRESENCE</text>
<text x="70.0" y="232.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#6D675F" text-anchor="start">onde o artigo aparece no citante</text>
<rect x="378.0" y="195.0" width="372.0" height="70.0" rx="12" fill="#FFFFFF" stroke="#4E8752" stroke-width="2" />
<text x="394.0" y="222.0" font-family="'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#4E8752" text-anchor="start">in_text</text>
<text x="394.0" y="245.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#6D675F" text-anchor="start">no corpo do texto</text>
<rect x="768.0" y="195.0" width="372.0" height="70.0" rx="12" fill="#FFFFFF" stroke="#D9822B" stroke-width="2" />
<text x="784.0" y="222.0" font-family="'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#D9822B" text-anchor="start">reference_list_only</text>
<text x="784.0" y="245.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#6D675F" text-anchor="start">só na lista de referências</text>
<rect x="1158.0" y="195.0" width="372.0" height="70.0" rx="12" fill="#FFFFFF" stroke="#6D675F" stroke-width="2" />
<text x="1174.0" y="222.0" font-family="'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" fill="#6D675F" text-anchor="start">not_cited</text>
<text x="1174.0" y="245.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#6D675F" text-anchor="start">não aparece em lugar nenhum</text>
<rect x="48.0" y="310.0" width="1504.0" height="168.0" rx="20" fill="#FFFFFF" stroke="#E4DFD7" stroke-width="1.5" filter="url(#cardShadow)"/>
<text x="70.0" y="342.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#161311" text-anchor="start">EIXO 2 · DEPTH</text>
<text x="70.0" y="366.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" fill="#6D675F" text-anchor="start">quanto o artigo importou para quem citou — escala ordinal, só quando presence = in_text</text>
