<text x="596.0" y="634.0" font-family="'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="16.5" font-weight="700" fill="#D9822B" text-anchor="start">imprecise</text>
<text x="596.0" y="653.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#6D675F" text-anchor="start">leitura frouxa, ampliada</text>
<rect x="578.0" y="670.0" width="8.0" height="8.0" rx="2" fill="#C96F3F" />
<text x="596.0" y="678.0" font-family="'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="16.5" font-weight="700" fill="#C96F3F" text-anchor="start">misrepresented</text>
<text x="596.0" y="697.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#6D675F" text-anchor="start">o artigo não diz isso</text>
