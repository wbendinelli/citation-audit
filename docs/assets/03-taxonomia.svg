<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">Uma citação, perguntas separadas</title><desc id="desc">Presença, profundidade, postura, exatidão e reuso são julgados independentemente. Apoio não garante exatidão.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#606060" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1440" height="850" rx="28" fill="#F2F3F3"/>
<text x="56" y="56" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#606060" text-anchor="start" letter-spacing="2">COMO CADA CITAÇÃO É LIDA</text>
<text x="56" y="111" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="500" fill="#212322" text-anchor="start">Uma citação, perguntas separadas</text>
<rect x="56" y="202" width="1328" height="87" rx="20" fill="#FFFFFF"/>
<text x="80" y="254" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#212322" text-anchor="start">Presença</text>
<text x="360" y="254" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="500" fill="#212322" text-anchor="start">Onde aparece?</text>
<text x="800" y="254" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#606060" text-anchor="start">No corpo, nas referências ou ausente.</text>
<rect x="56" y="307" width="1328" height="87" rx="20" fill="#FFFFFF"/>
<text x="80" y="359" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#212322" text-anchor="start">Profundidade</text>
<text x="360" y="359" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="500" fill="#212322" text-anchor="start">Quanto foi usado?</text>
<text x="800" y="359" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#606060" text-anchor="start">Da menção ao apoio do argumento.</text>
<rect x="56" y="412" width="1328" height="87" rx="20" fill="#FFFFFF"/>
<text x="80" y="464" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#212322" text-anchor="start">Postura</text>
<text x="360" y="464" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="500" fill="#212322" text-anchor="start">Qual é a posição?</text>
<text x="800" y="464" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#606060" text-anchor="start">Apoia, contrapõe ou só menciona.</text>
<rect x="56" y="517" width="1328" height="87" rx="20" fill="#FFFFFF"/>
<text x="80" y="569" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#212322" text-anchor="start">Exatidão</text>
<text x="360" y="569" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="500" fill="#212322" text-anchor="start">O original diz isso?</text>
<text x="800" y="569" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#606060" text-anchor="start">Confronto com o artigo-fonte.</text>
<rect x="56" y="622" width="1328" height="87" rx="20" fill="#FFFFFF"/>
<text x="80" y="674" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#212322" text-anchor="start">Reuso</text>
<text x="360" y="674" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="29" font-weight="500" fill="#212322" text-anchor="start">O que foi adotado?</text>
<text x="800" y="674" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#606060" text-anchor="start">Método, dado ou resultado verificável.</text>
<text x="56" y="784" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#606060" text-anchor="start">Postura de apoio e exatidão são julgadas separadamente. O veredito combina as evidências.</text>
</svg>
