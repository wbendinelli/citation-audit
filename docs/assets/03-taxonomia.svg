<text x="596.0" y="590.0" font-family="'JetBrains Mono', SFMono-Regular, Menlo, monospace" font-size="16.5" font-weight="700" fill="#4E8752" text-anchor="start">accurate</text>
<text x="596.0" y="609.0" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="500" fill="#6D675F" text-anchor="start">corresponde ao artigo</text>
