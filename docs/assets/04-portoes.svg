<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Quando a evidência permite classificar</title><desc id="desc">Texto correto, corpo disponível e presença verificada são conferidos antes do julgamento. Falta de corpo é pendência. Ausência confirmada manualmente é aresta falsa.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#606060" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1440" height="900" rx="28" fill="#F2F3F3"/>
<text x="56" y="56" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#606060" text-anchor="start" letter-spacing="2">OS PORTÕES DA EVIDÊNCIA</text>
<text x="56" y="111" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="500" fill="#212322" text-anchor="start">Quando é possível classificar uma citação</text>
<rect x="56" y="208" width="424" height="178" rx="20" fill="#FFFFFF"/>
<text x="78" y="250" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#212322" text-anchor="start">Texto correto</text>
<text x="78" y="290" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#606060" text-anchor="start">Confere com o título</text>
<text x="78" y="322" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#606060" text-anchor="start">do documento citante.</text>
<path d="M485,297.0 L501,297.0" fill="none" stroke="#606060" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="508" y="208" width="424" height="178" rx="20" fill="#FFFFFF"/>
<text x="530" y="250" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#212322" text-anchor="start">Corpo disponível</text>
<text x="530" y="290" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#606060" text-anchor="start">Página de rosto</text>
<text x="530" y="322" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#606060" text-anchor="start">não comprova o corpo.</text>
<path d="M937,297.0 L953,297.0" fill="none" stroke="#606060" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="960" y="208" width="424" height="178" rx="20" fill="#FFFFFF"/>
<text x="982" y="250" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#212322" text-anchor="start">Presença verificada</text>
<text x="982" y="290" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#606060" text-anchor="start">Busca no corpo</text>
<text x="982" y="322" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#606060" text-anchor="start">e nas referências.</text>
<rect x="56" y="452" width="1328" height="88" rx="20" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
<text x="80" y="505" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#212322" text-anchor="start">Evidência recuperada</text>
<text x="590" y="505" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#606060" text-anchor="start">Classificar e preservar a passagem.</text>
<rect x="56" y="558" width="1328" height="88" rx="20" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
<text x="80" y="611" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#212322" text-anchor="start">Corpo indisponível</text>
<text x="590" y="611" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#606060" text-anchor="start">Registrar pendência; obter o texto.</text>
<rect x="56" y="664" width="1328" height="88" rx="20" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
<text x="80" y="717" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#212322" text-anchor="start">Ausência confirmada</text>
<text x="590" y="717" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#606060" text-anchor="start">Veredito manual: aresta falsa.</text>
<text x="56" y="828" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#606060" text-anchor="start">Somente nas referências é achado de fantasma apenas com corpo completo comprovado.</text>
</svg>
