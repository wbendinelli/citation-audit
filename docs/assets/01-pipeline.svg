<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
<title id="title">Da citação ao resultado verificável</title><desc id="desc">Reunir registros, conferir evidência, ler a passagem e gerar resultados. Texto indisponível permanece pendente.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#606060" stroke-width="1.5"/></marker></defs>
<rect x="0" y="0" width="1440" height="640" rx="28" fill="#F2F3F3"/>
<text x="56" y="56" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#606060" text-anchor="start" letter-spacing="2">COMO A ANÁLISE ACONTECE</text>
<text x="56" y="111" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="500" fill="#212322" text-anchor="start">Da citação ao resultado verificável</text>
<rect x="56" y="215" width="308" height="220" rx="20" fill="#FFFFFF"/>
<text x="78" y="260" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#212322" text-anchor="start">Reunir registros</text>
<text x="78" y="302" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#606060" text-anchor="start">Cruzar bases e listas.</text>
<text x="78" y="334" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#606060" text-anchor="start">Deduplicar as obras.</text>
<path d="M370,325.0 L387,325.0" fill="none" stroke="#606060" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="396" y="215" width="308" height="220" rx="20" fill="#FFFFFF"/>
<text x="418" y="260" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#212322" text-anchor="start">Conferir a evidência</text>
<text x="418" y="302" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#606060" text-anchor="start">Confirmar o documento</text>
<text x="418" y="334" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#606060" text-anchor="start">e conferir o corpo.</text>
<path d="M710,325.0 L727,325.0" fill="none" stroke="#606060" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="736" y="215" width="308" height="220" rx="20" fill="#FFFFFF"/>
<text x="758" y="260" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#212322" text-anchor="start">Ler a passagem</text>
<text x="758" y="302" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#606060" text-anchor="start">Confrontar a passagem</text>
<text x="758" y="334" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#606060" text-anchor="start">com o artigo original.</text>
<path d="M1050,325.0 L1067,325.0" fill="none" stroke="#606060" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1076" y="215" width="308" height="220" rx="20" fill="#FFFFFF"/>
<text x="1098" y="260" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" font-weight="500" fill="#212322" text-anchor="start">Gerar resultados</text>
<text x="1098" y="302" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#606060" text-anchor="start">Derivar os números</text>
<text x="1098" y="334" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#606060" text-anchor="start">e gerar as figuras.</text>
<rect x="56" y="490" width="1328" height="92" rx="20" fill="#FFFFFF" stroke="#DDDDDD" stroke-width="1.5"/>
<text x="80" y="527" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#606060" text-anchor="start">Texto indisponível permanece na fila de pendências; a qualidade da citação fica sem julgamento.</text>
</svg>
